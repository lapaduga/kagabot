<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Кагаботик — Paint</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #fdfbf6; user-select: none;
  }
  #wrap { position: fixed; inset: 0; cursor: crosshair; }
  canvas { position: absolute; inset: 0; display: block; }
  #draw { z-index: 1; touch-action: none; }
  #game { z-index: 2; pointer-events: none; }

  #toolbar {
    position: fixed; z-index: 10; top: 14px; left: 14px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 10px 14px; border-radius: 16px;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 6px 24px rgba(60,40,20,0.15);
    backdrop-filter: blur(10px);
    max-width: calc(100vw - 28px);
  }
  #swatches { display: flex; gap: 6px; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer;
    transition: transform .12s, border-color .12s; padding: 0;
  }
  .swatch:hover { transform: scale(1.1); }
  .swatch.active { border-color: #2b2b2b; transform: scale(1.15); }

  #colorPicker { width: 32px; height: 32px; border: none; background: none; cursor: pointer; padding: 0; }
  #size { width: 90px; accent-color: #2b2b2b; }

  .btn {
    border: none; background: #2b2b2b; color: #fff;
    padding: 7px 12px; border-radius: 9px; cursor: pointer;
    font: inherit; font-size: 13px;
    transition: background .15s, transform .1s;
  }
  .btn:hover { background: #444; }
  .btn:active { transform: scale(.96); }
  .btn.active { background: #e63946; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .btn.danger {
    background: #7B3FBF;
    box-shadow: 0 0 0 0 rgba(123,63,191,0.6);
    animation: pulse 2.2s infinite;
  }
  .btn.danger:hover:not(:disabled) { background: #5E2E94; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(123,63,191,0.55); }
    50%      { box-shadow: 0 0 0 6px rgba(123,63,191,0); }
  }

  #hint {
    position: fixed; bottom: 16px; right: 16px; z-index: 10;
    background: rgba(43,43,43,0.85); color: #fff;
    padding: 8px 14px; border-radius: 10px; font-size: 13px;
    pointer-events: none;
    animation: fadeOut 1.4s ease 11s forwards;
  }
  @keyframes fadeOut { to { opacity: 0; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="draw"></canvas>
  <canvas id="game"></canvas>
</div>
<div id="toolbar">
  <div id="swatches"></div>
  <input type="color" id="colorPicker" value="#e63946">
  <input type="range" id="size" min="2" max="48" value="10">
  <button class="btn" id="eraserBtn">Ластик</button>
  <button class="btn" id="clearBtn">Очистить</button>
  <button class="btn danger" id="releaseBtn">💥 Выпустить Канамотика</button>
</div>
<div id="hint">Рисуй мышкой. Или выпусти Канамотика 💥</div>

<script>
(() => {
'use strict';

/* =========================================================
   1. CANVASES
   ========================================================= */
const drawCanvas = document.getElementById('draw');
const gameCanvas = document.getElementById('game');
const dctx = drawCanvas.getContext('2d', { willReadFrequently: true });
const gctx = gameCanvas.getContext('2d');

let W = window.innerWidth;
let H = window.innerHeight;

/* =========================================================
   2. TUNING
   ========================================================= */
const GRAVITY   = 0.68;
const JUMP_V    = -21;
const JUMP_APEX = (JUMP_V * JUMP_V) / (2 * GRAVITY);
const ACC       = 0.38;
const MAX_VX    = 2.4;
const FRICTION  = 0.86;
const MOUTH_OFFSET_Y = 26;
const MOUTH_OFFSET_X = 8;
const REACH_MARGIN = 40;

const CURSOR_MEMORY_MS = 1500;
const MIN_SHOOT_DIST   = 90;
const AIM_DURATION     = 40;
const SHOOT_COOLDOWN   = 150;
const ROCKET_SPEED     = 13;

const ROCKET_DAMAGE  = 28;
const BULLET_DAMAGE  = 5;
const BULLET_SPEED   = 22;
const KAG_SHOOT_INT  = 150;
const KAN_SHOOT_INT  = 28;
const HIT_RADIUS     = 34;
const MAX_HP         = 100;

const DODGE_COOLDOWN = 50;
const DODGE_TTI_MIN  = 14;
const DODGE_TTI_MAX  = 40;
const DODGE_SWEET    = 26;

// --- Усталость ---
const STAMINA_MAX          = 100;
const STAMINA_JUMP_COST    = 10;
const STAMINA_DODGE_COST   = 15;
const STAMINA_HIT_COST     = 8;
const STAMINA_REGEN_GROUND = 0.5;
const STAMINA_REGEN_AIR    = 0.05;
const STAMINA_REGEN_ADREN  = 0.3;   // bonus при hp < 30%
const STAMINA_MIN_JUMP     = 15;
const STAMINA_MIN_DODGE    = 20;

// --- Нож Канамотика ---
const KNIFE_DAMAGE        = 15;
const KNIFE_RANGE         = 62;
const KNIFE_COOLDOWN      = 55;
const KNIFE_SWING_DUR     = 24;
const CHARGE_SPEED        = 4.6;
const CHARGE_DECISION_INT = 100;
const CHARGE_MAX_DURATION = 200;
const CHARGE_RETREAT_DUR  = 70;
const KNIFE_STAMINA_COST  = 15;
const CHARGE_MOVE_STAMINA = 0.3;

/* =========================================================
   3. STATE
   ========================================================= */
const k = {
  x: W / 2, y: H - 55, vx: 0, vy: 0,
  groundY: H - 55,
  facing: 1, onGround: true,
  mood: 'idle',
  mouthOpen: 0, squash: 1,
  blink: false, blinkTimer: 90,
  eatAnim: 0, happyTimer: 0, eatCooldown: 0, jumpCooldown: 0,
  committedFood: null,
  bazooka: { state: 'idle', aimAngle: 0, aiming: 0, cooldown: 0, recoil: 0, alpha: 0 },
  hp: MAX_HP, maxHp: MAX_HP,
  hitFlash: 0,
  shootTimer: 60,
  deathAngle: 0,
  deathAlpha: 1,
  luck: 1, dodgeChance: 0.7, critChance: 0.15, morale: 0,
  dodgeCooldown: 0, dodgeFlash: 0, sidestepVx: 0,
  stamina: STAMINA_MAX,
};

const kanamotik = {
  active: false, entering: false,
  x: 0, y: 0, vx: 0, vy: 0,
  groundY: 0, facing: -1,
  hp: MAX_HP, maxHp: MAX_HP,
  hitFlash: 0,
  shootCooldown: 60,
  gunAngle: Math.PI, gunRecoil: 0,
  alpha: 1,
  deathAngle: 0, dead: false,
  squash: 1, onGround: true,
  luck: 1, dodgeChance: 0.7, critChance: 0.15, morale: 0,
  dodgeCooldown: 0, dodgeFlash: 0, sidestepVx: 0,
  stamina: STAMINA_MAX,
  // Нож
  combatMode: 'ranged',   // ranged | charging | retreating
  chargeTimer: 0,
  chargeDecision: 80,
  knifeCooldown: 0,
  knifeSwing: 0,
  knifeHitDone: false,
  homeX: 0,
};

const duel = {
  active: false,
  phase: 'idle',
  winner: null,
  endTimer: 0,
  duration: 0,
};

const cursor = { x: -1000, y: -1000, seenAt: -100000 };
const rockets = [];
const bullets = [];
const explosions = [];
const particles = [];

/* =========================================================
   4. RESIZE
   ========================================================= */
function resize() {
  const oldW = drawCanvas.width, oldH = drawCanvas.height;
  let backup = null;
  if (oldW && oldH) {
    backup = document.createElement('canvas');
    backup.width = oldW; backup.height = oldH;
    backup.getContext('2d').drawImage(drawCanvas, 0, 0);
  }
  W = window.innerWidth; H = window.innerHeight;
  drawCanvas.width = W; drawCanvas.height = H;
  gameCanvas.width = W; gameCanvas.height = H;
  dctx.lineCap = 'round'; dctx.lineJoin = 'round';
  if (backup) dctx.drawImage(backup, 0, 0);

  k.groundY = H - 55;
  if (k.y > k.groundY) k.y = k.groundY;
  if (k.x > W - 30) k.x = W / 2;
}

/* =========================================================
   5. TOOLBAR
   ========================================================= */
const PALETTE = ['#e63946','#f4a261','#ffd166','#2a9d8f','#457b9d','#9d4edd','#222222','#ffffff'];
let currentColor = '#e63946';
let currentSize  = 10;
let isEraser     = false;

const swatchBox = document.getElementById('swatches');
PALETTE.forEach((c, i) => {
  const s = document.createElement('button');
  s.className = 'swatch' + (i === 0 ? ' active' : '');
  s.style.background = c;
  if (c === '#ffffff') s.style.border = '2px solid #ccc';
  s.addEventListener('click', () => {
    currentColor = c; isEraser = false;
    eraserBtn.classList.remove('active');
    colorPicker.value = c;
    document.querySelectorAll('.swatch').forEach(el => el.classList.remove('active'));
    s.classList.add('active');
  });
  swatchBox.appendChild(s);
});

const colorPicker = document.getElementById('colorPicker');
colorPicker.addEventListener('input', () => {
  currentColor = colorPicker.value; isEraser = false;
  eraserBtn.classList.remove('active');
  document.querySelectorAll('.swatch').forEach(el => el.classList.remove('active'));
});

const sizeSlider = document.getElementById('size');
sizeSlider.addEventListener('input', () => currentSize = +sizeSlider.value);

const eraserBtn = document.getElementById('eraserBtn');
eraserBtn.addEventListener('click', () => {
  isEraser = !isEraser;
  eraserBtn.classList.toggle('active', isEraser);
});

const clearBtn = document.getElementById('clearBtn');
clearBtn.addEventListener('click', () => dctx.clearRect(0, 0, W, H));

const releaseBtn = document.getElementById('releaseBtn');
releaseBtn.addEventListener('click', () => {
  if (duel.active) return;
  startDuel();
});

/* =========================================================
   6. РИСОВАНИЕ + ТРЕКИНГ
   ========================================================= */
let drawing = false, lastX = 0, lastY = 0;
const pointerXY = e => {
  const r = drawCanvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
};

function stroke(x1, y1, x2, y2) {
  dctx.save();
  dctx.globalCompositeOperation = isEraser ? 'destination-out' : 'source-over';
  dctx.strokeStyle = isEraser ? 'rgba(0,0,0,1)' : currentColor;
  dctx.fillStyle   = dctx.strokeStyle;
  dctx.lineWidth   = currentSize;
  dctx.beginPath();
  dctx.moveTo(x1, y1); dctx.lineTo(x2, y2); dctx.stroke();
  dctx.beginPath();
  dctx.arc(x2, y2, currentSize / 2, 0, Math.PI * 2); dctx.fill();
  dctx.restore();
}

function noteCursor(x, y) { cursor.x = x; cursor.y = y; cursor.seenAt = performance.now(); }

drawCanvas.addEventListener('pointerdown', e => {
  drawing = true;
  drawCanvas.setPointerCapture(e.pointerId);
  const p = pointerXY(e);
  lastX = p.x; lastY = p.y;
  noteCursor(p.x, p.y);
  stroke(p.x, p.y, p.x, p.y);
});
drawCanvas.addEventListener('pointermove', e => {
  const p = pointerXY(e);
  noteCursor(p.x, p.y);
  if (!drawing) return;
  stroke(lastX, lastY, p.x, p.y);
  lastX = p.x; lastY = p.y;
});
['pointerup','pointercancel','pointerleave'].forEach(ev =>
  drawCanvas.addEventListener(ev, () => drawing = false));

/* =========================================================
   7. SAMPLE + ПОИСК ЕДЫ
   ========================================================= */
const SAMPLE_SCALE = 0.3;
const sampleCanvas = document.createElement('canvas');
const sctx = sampleCanvas.getContext('2d', { willReadFrequently: true });

function refreshSample() {
  const sw = Math.max(1, Math.floor(W * SAMPLE_SCALE));
  const sh = Math.max(1, Math.floor(H * SAMPLE_SCALE));
  if (sampleCanvas.width !== sw || sampleCanvas.height !== sh) {
    sampleCanvas.width = sw; sampleCanvas.height = sh;
  }
  sctx.clearRect(0, 0, sw, sh);
  sctx.drawImage(drawCanvas, 0, 0, sw, sh);
  return { sw, sh };
}

function findFood(cx, cy, minReachY) {
  const { sw, sh } = refreshSample();
  let data;
  try { data = sctx.getImageData(0, 0, sw, sh).data; } catch { return { reachable: null, any: null }; }
  const invS = 1 / SAMPLE_SCALE;
  const scx = cx * SAMPLE_SCALE, scy = cy * SAMPLE_SCALE;
  let bestR = null, bestRD = Infinity, bestA = null, bestAD = Infinity;

  for (let y = 0; y < sh; y++) {
    const rowOff = y * sw * 4;
    const dy = y - scy, dy2 = dy * dy;
    const worldY = y * invS;
    const reachable = worldY >= minReachY;
    for (let x = 0; x < sw; x++) {
      if (data[rowOff + x * 4 + 3] > 20) {
        const dx = x - scx;
        const d = dx * dx + dy2;
        if (d < bestAD) { bestAD = d; bestA = { x: x * invS, y: worldY }; }
        if (reachable && d < bestRD) { bestRD = d; bestR = { x: x * invS, y: worldY }; }
      }
    }
  }
  return { reachable: bestR, any: bestA };
}

/* =========================================================
   8. ЕДА
   ========================================================= */
function mouthTouchesPaint(mx, my, r = 14) {
  const x0 = Math.max(0, Math.floor(mx - r));
  const y0 = Math.max(0, Math.floor(my - r));
  const x1 = Math.min(W, Math.floor(mx + r));
  const y1 = Math.min(H, Math.floor(my + r));
  const w = x1 - x0, h = y1 - y0;
  if (w <= 0 || h <= 0) return null;
  let data;
  try { data = dctx.getImageData(x0, y0, w, h).data; } catch { return null; }
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++)
      if (data[(y * w + x) * 4 + 3] > 20) return { x: x0 + x, y: y0 + y };
  return null;
}
function pixelHasPaint(x, y) {
  x = Math.floor(x); y = Math.floor(y);
  if (x < 0 || x >= W || y < 0 || y >= H) return false;
  try { return dctx.getImageData(x, y, 1, 1).data[3] > 20; } catch { return false; }
}
function getPixelColor(x, y) {
  x = Math.max(0, Math.min(W - 1, Math.floor(x)));
  y = Math.max(0, Math.min(H - 1, Math.floor(y)));
  try {
    const d = dctx.getImageData(x, y, 1, 1).data;
    if (d[3] < 10) return '#ffb27f';
    return `rgb(${d[0]},${d[1]},${d[2]})`;
  } catch { return '#ffb27f'; }
}
const MAX_BITE_RADIUS = 250;

function eatWholeBlob(mx, my) {
  const { sw, sh } = refreshSample();
  let data;
  try { data = sctx.getImageData(0, 0, sw, sh).data; } catch { return 0; }
  const smx = Math.floor(mx * SAMPLE_SCALE);
  const smy = Math.floor(my * SAMPLE_SCALE);
  if (smx < 0 || smx >= sw || smy < 0 || smy >= sh) return 0;
  if (data[(smy * sw + smx) * 4 + 3] < 20) return 0;

  const maxR = MAX_BITE_RADIUS * SAMPLE_SCALE;
  const maxR2 = maxR * maxR;
  const visited = new Uint8Array(sw * sh);
  const stack = [smy * sw + smx];
  visited[smy * sw + smx] = 1;
  const pixels = [];

  while (stack.length) {
    const p = stack.pop();
    const x = p % sw;
    const y = (p / sw) | 0;
    pixels.push(p);
    const ddx = x - smx, ddy = y - smy;
    if (ddx * ddx + ddy * ddy > maxR2) continue;
    for (let i = 0; i < 4; i++) {
      const nx = x + (i === 0 ? 1 : i === 1 ? -1 : 0);
      const ny = y + (i === 2 ? 1 : i === 3 ? -1 : 0);
      if (nx < 0 || nx >= sw || ny < 0 || ny >= sh) continue;
      const np = ny * sw + nx;
      if (visited[np]) continue;
      if (data[np * 4 + 3] < 20) continue;
      visited[np] = 1; stack.push(np);
    }
  }
  if (!pixels.length) return 0;

  const px = 1 / SAMPLE_SCALE + 1.5;
  dctx.save();
  dctx.globalCompositeOperation = 'destination-out';
  dctx.fillStyle = 'rgba(0,0,0,1)';
  for (let i = 0; i < pixels.length; i++) {
    const p = pixels[i];
    const x = p % sw;
    const y = (p / sw) | 0;
    dctx.fillRect(x / SAMPLE_SCALE - 1, y / SAMPLE_SCALE - 1, px, px);
  }
  dctx.restore();
  return pixels.length;
}

/* =========================================================
   9. ЧАСТИЦЫ / ВЗРЫВЫ
   ========================================================= */
function spawnParticles(x, y, color, count, opts = {}) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = opts.speedMin !== undefined ? (opts.speedMin + Math.random() * (opts.speedMax - opts.speedMin)) : (1 + Math.random() * 2);
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp + (opts.gravity !== undefined ? opts.gravity : -1.8),
      life: (opts.lifeMin || 24) + Math.random() * (opts.lifeMax || 16),
      color, size: (opts.sizeMin || 2) + Math.random() * (opts.sizeMax || 2.5),
    });
  }
}
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += 0.2; p.x += p.vx; p.y += p.vy;
    p.vx *= 0.95; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function drawParticles(ctx) {
  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life / 20) * 0.9;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function explode(x, y, big = true, color = null) {
  const R = big ? 60 : 22;
  explosions.push({ x, y, life: big ? 34 : 12, maxLife: big ? 34 : 12, radius: R, small: !big, color });
  const count = big ? 26 : 6;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = (big ? 2 : 0.5) + Math.random() * (big ? 7 : 2);
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 1.5,
      life: (big ? 30 : 12) + Math.random() * (big ? 22 : 8),
      color: color || ['#ffcc44','#ff8833','#ff5522','#ffe9a8'][i % 4],
      size: (big ? 3 : 1.5) + Math.random() * (big ? 4 : 2),
    });
  }
  if (big) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 0.5 + Math.random() * 2;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
        life: 60 + Math.random() * 30,
        color: 'rgba(120,120,120,0.6)',
        size: 6 + Math.random() * 6,
      });
    }
  }
}
function updateExplosions() {
  for (let i = explosions.length - 1; i >= 0; i--) {
    explosions[i].life--;
    if (explosions[i].life <= 0) explosions.splice(i, 1);
  }
}
function drawExplosions(ctx) {
  for (const e of explosions) {
    const t = 1 - e.life / e.maxLife;
    const alpha = Math.max(0, e.life / e.maxLife);
    const radius = e.radius * (e.small ? (1 - t * 0.6) : (0.3 + t * 0.9));
    ctx.save();
    ctx.globalAlpha = alpha;
    const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, radius);
    if (e.color) {
      g.addColorStop(0, e.color);
      g.addColorStop(0.5, 'rgba(255,200,100,0.6)');
      g.addColorStop(1, 'rgba(255,100,40,0)');
    } else {
      g.addColorStop(0, 'rgba(255,245,200,0.95)');
      g.addColorStop(0.4, 'rgba(255,170,60,0.75)');
      g.addColorStop(0.75, 'rgba(255,90,30,0.35)');
      g.addColorStop(1, 'rgba(120,40,10,0)');
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(e.x, e.y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

/* =========================================================
   10. СНАРЯДЫ + УРОН
   ========================================================= */
function applyDamage(target, baseDamage, attacker) {
  const isCrit = Math.random() < attacker.critChance;
  let dmg = baseDamage * attacker.luck;
  if (isCrit) dmg *= 1.7;
  dmg = Math.round(dmg);

  target.hp = Math.max(0, target.hp - dmg);
  target.hitFlash = isCrit ? 18 : 12;
  target.morale = Math.max(-0.15, target.morale - (isCrit ? 0.06 : 0.04));
  // Удар выматывает
  target.stamina = Math.max(0, target.stamina - STAMINA_HIT_COST);

  return { dmg, isCrit };
}

function fireRocket(x, y, angle, owner) {
  rockets.push({
    x, y,
    vx: Math.cos(angle) * ROCKET_SPEED,
    vy: Math.sin(angle) * ROCKET_SPEED,
    angle, life: 140, trail: [], owner,
  });
  explode(x, y, false);
  spawnParticles(x, y, '#ffcc44', 8, { speedMin: 2, speedMax: 5, gravity: 0, lifeMin: 12, lifeMax: 10, sizeMin: 2, sizeMax: 2 });
}

function fireBullet(x, y, angle, owner) {
  bullets.push({
    x, y,
    vx: Math.cos(angle) * BULLET_SPEED,
    vy: Math.sin(angle) * BULLET_SPEED,
    angle, life: 90, trail: [], owner,
  });
  explode(x, y, false);
  spawnParticles(x, y, '#ffd166', 3, { speedMin: 1, speedMax: 3, gravity: 0, lifeMin: 8, lifeMax: 6, sizeMin: 1.2, sizeMax: 1.2 });
}

function updateRockets() {
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.trail.push({ x: r.x, y: r.y });
    if (r.trail.length > 16) r.trail.shift();
    r.x += r.vx; r.y += r.vy; r.life--;

    let hit = false;
    if (r.owner === 'kagabotik' && duel.active && kanamotik.active && !kanamotik.dead && kanamotik.hp > 0) {
      const dx = r.x - kanamotik.x;
      const dy = r.y - (kanamotik.y - 30);
      if (dx * dx + dy * dy < HIT_RADIUS * HIT_RADIUS) {
        const res = applyDamage(kanamotik, ROCKET_DAMAGE, k);
        explode(r.x, r.y, true, res.isCrit ? '#ff4040' : null);
        if (res.isCrit) {
          spawnParticles(r.x, r.y, '#ffe066', 20, { speedMin: 3, speedMax: 8, gravity: 0, lifeMin: 30, lifeMax: 20, sizeMin: 3, sizeMax: 4 });
        }
        hit = true;
      }
    }

    if (r.x < -20 || r.x > W + 20 || r.y < -20 || r.y > H + 20) hit = true;
    if (r.life <= 0) hit = true;

    if (hit && r.life > 0) {
      if (r.x >= -20 && r.x <= W + 20 && r.y >= -20 && r.y <= H + 20) {
        explode(Math.max(0, Math.min(W, r.x)), Math.max(0, Math.min(H, r.y)), true);
      }
      rockets.splice(i, 1);
    } else if (hit) {
      rockets.splice(i, 1);
    }
  }
}

function updateBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 6) b.trail.shift();
    b.x += b.vx; b.y += b.vy; b.life--;

    let hit = false;
    if (b.owner === 'kanamotik' && duel.active && k.hp > 0) {
      const dx = b.x - k.x;
      const dy = b.y - (k.y - 30);
      if (dx * dx + dy * dy < HIT_RADIUS * HIT_RADIUS) {
        const res = applyDamage(k, BULLET_DAMAGE, kanamotik);
        explode(b.x, b.y, false, res.isCrit ? '#ff4040' : null);
        if (res.isCrit) {
          spawnParticles(b.x, b.y, '#ffe066', 8, { speedMin: 2, speedMax: 5, gravity: 0, lifeMin: 18, lifeMax: 12, sizeMin: 2, sizeMax: 3 });
        }
        hit = true;
      }
    }
    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) hit = true;
    if (b.life <= 0) hit = true;
    if (hit) bullets.splice(i, 1);
  }
}

function drawRockets(ctx) {
  for (const r of rockets) {
    for (let i = 0; i < r.trail.length; i++) {
      const t = r.trail[i];
      const a = i / r.trail.length;
      ctx.globalAlpha = a * 0.7;
      ctx.fillStyle = i % 3 === 0 ? '#ffd166' : '#ff7733';
      ctx.beginPath(); ctx.arc(t.x, t.y, 1 + a * 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(r.angle);
    ctx.fillStyle = '#ffcc44';
    ctx.beginPath(); ctx.moveTo(-7, -3); ctx.lineTo(-18, 0); ctx.lineTo(-7, 3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath(); ctx.moveTo(-6, -1.5); ctx.lineTo(-12, 0); ctx.lineTo(-6, 1.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c92a2a';
    ctx.fillRect(-8, -4, 15, 8);
    ctx.fillStyle = '#8a1c1c';
    ctx.beginPath(); ctx.moveTo(7, -4); ctx.lineTo(14, 0); ctx.lineTo(7, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f1c40f';
    ctx.fillRect(-2, -4, 3, 8);
    ctx.restore();
  }
}

function drawBullets(ctx) {
  for (const b of bullets) {
    for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i];
      const a = i / b.trail.length;
      ctx.globalAlpha = a * 0.6;
      ctx.fillStyle = '#ffe066';
      ctx.beginPath(); ctx.arc(t.x, t.y, 1 + a * 1.8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.angle);
    ctx.fillStyle = '#fff8b0';
    ctx.beginPath(); ctx.ellipse(0, 0, 5, 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffcc44';
    ctx.beginPath(); ctx.ellipse(2, 0, 3, 1.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

/* =========================================================
   11. УВОРОТ + СТАМИНА
   ========================================================= */
function detectIncomingDanger(bot, projectiles, targetsMe) {
  const bx = bot.x;
  const by = bot.y - 30;
  let best = null;

  for (const p of projectiles) {
    if (!targetsMe(p)) continue;
    const dx = bx - p.x;
    const dy = by - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 1) continue;
    const ux = dx / dist, uy = dy / dist;
    const approach = p.vx * ux + p.vy * uy;
    if (approach < 3) continue;
    const tti = dist / approach;
    if (tti < DODGE_TTI_MIN || tti > DODGE_TTI_MAX) continue;
    const score = 1 - Math.abs(tti - DODGE_SWEET) / 30;
    if (!best || score > best.score) best = { p, tti, score };
  }
  return best;
}

function tryDodge(bot, danger, opponentX, opponentY) {
  if (!danger) return false;
  if (bot.dodgeCooldown > 0) return false;
  if (!bot.onGround) return false;
  if (bot.stamina < STAMINA_MIN_DODGE) return false;  // УСТАЛОСТЬ

  const hpRatio = bot.hp / bot.maxHp;
  const comeback = hpRatio < 0.4 ? (0.4 - hpRatio) * 0.5 : 0;
  const fatigue = Math.max(0.5, 1 - duel.duration / 900);
  const staminaFactor = 0.55 + 0.45 * (bot.stamina / STAMINA_MAX);   // <-- выносливость влияет
  const chance = Math.max(0, Math.min(0.95,
    (bot.dodgeChance + comeback + bot.morale) * fatigue * staminaFactor * (0.6 + danger.score * 0.6)
  ));

  if (Math.random() > chance) return false;

  const roll = Math.random();
  if (roll < 0.7) {
    bot.vy = -20 - Math.random() * 4;
    bot.onGround = false;
  } else {
    const dir = opponentX > bot.x ? -1 : 1;
    bot.vy = -14 - Math.random() * 3;
    bot.vx = dir * (3 + Math.random() * 1.5);
    bot.onGround = false;
  }
  bot.stamina = Math.max(0, bot.stamina - STAMINA_DODGE_COST);

  spawnParticles(bot.x, bot.groundY, '#ffffff', 7, { speedMin: 1, speedMax: 3, gravity: 0.1, lifeMin: 12, lifeMax: 8, sizeMin: 1.5, sizeMax: 1.5 });
  bot.dodgeCooldown = DODGE_COOLDOWN;
  bot.dodgeFlash = 10;
  bot.morale = Math.min(0.15, bot.morale + 0.03);
  return true;
}

// Уворот от милишной атаки (для Кагаботика)
function tryMeleeEvade(bot, attacker) {
  if (!bot.onGround) return false;
  if (bot.dodgeCooldown > 0) return false;
  if (bot.stamina < STAMINA_MIN_DODGE) return false;

  const dist = Math.abs(bot.x - attacker.x);
  if (dist > 130) return false;

  const chance = 0.45 * (0.6 + 0.4 * (bot.stamina / STAMINA_MAX));
  if (Math.random() > chance) return false;

  bot.vy = -17;
  bot.vx = (bot.x > attacker.x ? 1 : -1) * 4.5;
  bot.onGround = false;
  bot.stamina = Math.max(0, bot.stamina - STAMINA_DODGE_COST);
  bot.dodgeCooldown = 40;
  bot.dodgeFlash = 10;

  spawnParticles(bot.x, bot.groundY, '#ffffff', 5, { speedMin: 1, speedMax: 2.5, gravity: 0.1, lifeMin: 10, lifeMax: 6, sizeMin: 1.5, sizeMax: 1.5 });
  return true;
}

/* =========================================================
   12. ДУЭЛЬ
   ========================================================= */
function randomizeFighter(b, aggression) {
  b.luck = 0.85 + Math.random() * 0.3;
  b.dodgeChance = 0.55 + Math.random() * 0.3;
  b.critChance = 0.12 + Math.random() * 0.08;
  b.morale = 0;
  b.dodgeCooldown = 0;
  b.dodgeFlash = 0;
  b.sidestepVx = 0;
  b.stamina = STAMINA_MAX;
  if (Math.random() < 0.5) {
    b.dodgeChance += aggression * 0.05;
    b.critChance   -= aggression * 0.02;
  } else {
    b.dodgeChance -= aggression * 0.05;
    b.critChance   += aggression * 0.03;
  }
}

function startDuel() {
  if (duel.active) return;
  duel.active = true;
  duel.phase = 'entering';
  duel.winner = null;
  duel.endTimer = 0;
  duel.duration = 0;

  kanamotik.active = true;
  kanamotik.entering = true;
  kanamotik.x = W + 100;
  kanamotik.y = H - 55;
  kanamotik.groundY = H - 55;
  kanamotik.vx = 0; kanamotik.vy = 0;
  kanamotik.facing = -1;
  kanamotik.hp = MAX_HP;
  kanamotik.hitFlash = 0;
  kanamotik.shootCooldown = 80;
  kanamotik.gunAngle = Math.PI;
  kanamotik.gunRecoil = 0;
  kanamotik.alpha = 1;
  kanamotik.deathAngle = 0;
  kanamotik.dead = false;
  kanamotik.squash = 1;
  kanamotik.onGround = true;
  kanamotik.combatMode = 'ranged';
  kanamotik.chargeTimer = 0;
  kanamotik.chargeDecision = 80;
  kanamotik.knifeCooldown = 0;
  kanamotik.knifeSwing = 0;
  kanamotik.knifeHitDone = false;

  k.hp = MAX_HP;
  k.hitFlash = 0;
  k.shootTimer = 80;
  k.deathAngle = 0;
  k.deathAlpha = 1;
  k.bazooka.state = 'idle';
  k.bazooka.cooldown = 0;
  k.vx = 0;

  randomizeFighter(k, 0.5);
  randomizeFighter(kanamotik, 0.7);

  rockets.length = 0;
  bullets.length = 0;

  releaseBtn.disabled = true;
}

function endDuel() {
  duel.active = false;
  duel.phase = 'idle';
  duel.winner = null;
  kanamotik.active = false;
  kanamotik.dead = false;
  kanamotik.hp = MAX_HP;
  kanamotik.deathAngle = 0;
  kanamotik.combatMode = 'ranged';
  kanamotik.knifeSwing = 0;
  kanamotik.knifeHitDone = false;

  k.hp = MAX_HP;
  k.hitFlash = 0;
  k.deathAngle = 0;
  k.deathAlpha = 1;
  k.shootTimer = 60;
  k.bazooka.state = 'idle';
  k.bazooka.cooldown = 0;
  k.morale = 0;
  k.stamina = STAMINA_MAX;

  rockets.length = 0;
  bullets.length = 0;

  releaseBtn.disabled = false;
}

const KAG_TARGET_X = () => Math.max(80, W * 0.28);
const KAN_TARGET_X = () => Math.min(W - 80, W * 0.72);

function KAN_SHOOT_INTERVAL() {
  return KAN_SHOOT_INT + Math.floor((Math.random() - 0.5) * 10);
}

// --- Решение о рывке с ножом ---
function shouldKanamotikCharge() {
  if (kanamotik.stamina < 25) return false;
  if (kanamotik.knifeCooldown > 20) return false;

  const dist = Math.abs(k.x - kanamotik.x);
  if (dist < 100) return false;   // уже близко, смысла нет

  const kagReloading = k.bazooka.state === 'cooldown' && k.bazooka.cooldown > 50;
  const kagLowHp = k.hp <= 35;
  const kagAiming = k.bazooka.state === 'aiming';

  let chance = 0.12;
  if (kagReloading) chance += 0.45;
  if (kagLowHp) chance += 0.25;
  if (kagAiming) chance -= 0.25;
  if (kanamotik.stamina < 50) chance *= 0.5;
  if (kanamotik.stamina < 35) chance *= 0.4;

  return Math.random() < chance;
}

function updateDuel() {
  duel.duration++;
  const bz = k.bazooka;

  if (duel.phase === 'entering') {
    kanamotik.x += -MAX_VX * 1.5;
    kanamotik.facing = -1;

    const tX = KAG_TARGET_X();
    if (Math.abs(k.x - tX) > 6) {
      k.vx = Math.sign(tX - k.x) * MAX_VX * 0.9;
      k.facing = k.vx > 0 ? 1 : -1;
    } else {
      k.vx *= 0.8;
      k.facing = 1;
    }
    k.mood = 'angry';
    bz.alpha += (1 - bz.alpha) * 0.12;

    if (kanamotik.x <= KAN_TARGET_X()) {
      kanamotik.x = KAN_TARGET_X();
      kanamotik.entering = false;
      kanamotik.homeX = kanamotik.x;
      duel.phase = 'fight';
      kanamotik.shootCooldown = 50;
      k.shootTimer = 50;
    }
    return;
  }

  if (duel.phase === 'fight') {
    const kanAlive = !kanamotik.dead && kanamotik.hp > 0;
    const kagAlive = k.hp > 0;

    // === УВОРОТЫ ===
    if (kagAlive) {
      const danger = detectIncomingDanger(k, bullets, b => b.owner === 'kanamotik');
      if (!tryDodge(k, danger, kanamotik.x, kanamotik.y)) {
        // если не от снаряда — проверяем мили
        if (kanamotik.combatMode === 'charging') {
          tryMeleeEvade(k, kanamotik);
        }
      }
    }
    if (kanAlive) {
      const danger = detectIncomingDanger(kanamotik, rockets, r => r.owner === 'kagabotik');
      tryDodge(kanamotik, danger, k.x, k.y);
    }

    // === KAGABOTIK ===
    if (kagAlive) {
      k.vx *= 0.9;
      k.facing = 1;
      k.mood = 'angry';

      const sx = k.x + k.facing * 10;
      const sy = k.y - 42;
      const desired = Math.atan2((kanamotik.y - 30) - sy, kanamotik.x - sx);
      let diff = desired - bz.aimAngle;
      while (diff >  Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      bz.aimAngle += diff * 0.16;
      bz.alpha += (1 - bz.alpha) * 0.15;

      if (k.shootTimer > 0) k.shootTimer--;
      if (k.shootTimer <= 0 && kanAlive) {
        const jitter = (Math.random() - 0.5) * 0.06;
        const a = bz.aimAngle + jitter;
        const mx = sx + Math.cos(bz.aimAngle) * 34;
        const my = sy + Math.sin(bz.aimAngle) * 34;
        fireRocket(mx, my, a, 'kagabotik');
        bz.recoil = 6;
        k.vx -= Math.cos(bz.aimAngle) * 3.5;
        k.shootTimer = KAG_SHOOT_INT;
      }
    } else {
      k.mood = 'idle';
      bz.alpha += (0 - bz.alpha) * 0.1;
    }

    // === KANAMOTIK ===
    if (kanAlive) {
      kanamotik.gunRecoil *= 0.7;

      // ---- Combat mode ----
      if (kanamotik.combatMode === 'ranged') {
        kanamotik.vx *= 0.9;
        kanamotik.facing = -1;

        const sx = kanamotik.x + kanamotik.facing * 16;
        const sy = kanamotik.y - 42;
        const desired = Math.atan2((k.y - 30) - sy, k.x - sx);
        let diff = desired - kanamotik.gunAngle;
        while (diff >  Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        kanamotik.gunAngle += diff * 0.22;

        if (kanamotik.shootCooldown > 0) kanamotik.shootCooldown--;
        if (kanamotik.shootCooldown <= 0 && kagAlive) {
          const jitter = (Math.random() - 0.5) * 0.06;
          const a = kanamotik.gunAngle + jitter;
          const recoilBack = kanamotik.gunRecoil * 2;
          const mx = sx + Math.cos(kanamotik.gunAngle) * (24 - recoilBack);
          const my = sy + Math.sin(kanamotik.gunAngle) * (24 - recoilBack);
          fireBullet(mx, my, a, 'kanamotik');
          kanamotik.gunRecoil = 6;
          kanamotik.shootCooldown = KAN_SHOOT_INTERVAL();
        }

        // Решение о рывке
        kanamotik.chargeDecision--;
        if (kanamotik.chargeDecision <= 0) {
          kanamotik.chargeDecision = CHARGE_DECISION_INT;
          if (shouldKanamotikCharge()) {
            kanamotik.combatMode = 'charging';
            kanamotik.chargeTimer = CHARGE_MAX_DURATION;
          }
        }
      }
      else if (kanamotik.combatMode === 'charging') {
        kanamotik.chargeTimer--;
        const dx = k.x - kanamotik.x;
        const dist = Math.abs(dx);
        const dir = Math.sign(dx) || -1;
        kanamotik.facing = dir;

        // выносливость тратится на бег
        kanamotik.stamina = Math.max(0, kanamotik.stamina - CHARGE_MOVE_STAMINA);

        if (dist > KNIFE_RANGE * 0.75 && kanamotik.stamina > 5) {
          kanamotik.vx = dir * CHARGE_SPEED;
        } else {
          kanamotik.vx *= 0.7;

          // Атака
          if (kanamotik.knifeCooldown <= 0 && kanamotik.stamina >= 15) {
            kanamotik.knifeSwing = KNIFE_SWING_DUR;
            kanamotik.knifeCooldown = KNIFE_COOLDOWN;
            kanamotik.knifeHitDone = false;
            kanamotik.stamina = Math.max(0, kanamotik.stamina - KNIFE_STAMINA_COST);
          }
        }

        // Проверка попадания во время замаха
        if (kanamotik.knifeSwing > 0) {
          const progress = 1 - kanamotik.knifeSwing / KNIFE_SWING_DUR;
          if (!kanamotik.knifeHitDone && progress > 0.35 && progress < 0.7) {
            const curDist = Math.abs(k.x - kanamotik.x);
            if (curDist < KNIFE_RANGE && kagAlive) {
              const res = applyDamage(k, KNIFE_DAMAGE, kanamotik);
              kanamotik.knifeHitDone = true;
              spawnParticles(k.x, k.y - 30, '#ff4040', 16, { speedMin: 3, speedMax: 7, gravity: 0.3, lifeMin: 20, lifeMax: 15, sizeMin: 2, sizeMax: 3 });
              spawnParticles(k.x, k.y - 30, '#ff8080', 6, { speedMin: 1, speedMax: 3, gravity: 0.5, lifeMin: 25, lifeMax: 15, sizeMin: 2, sizeMax: 2.5 });
            }
          }
          kanamotik.knifeSwing--;
        }

        if (kanamotik.knifeCooldown > 0) kanamotik.knifeCooldown--;

        // Условие выхода: кончилось время или достигли цели и потратили нож
        const reachedAndAttacked = dist < 50 && kanamotik.knifeCooldown > 20;
        if (kanamotik.chargeTimer <= 0 || reachedAndAttacked || kanamotik.stamina < 10) {
          kanamotik.combatMode = 'retreating';
          kanamotik.chargeTimer = CHARGE_RETREAT_DUR;
        }
      }
      else if (kanamotik.combatMode === 'retreating') {
        kanamotik.chargeTimer--;
        if (kanamotik.knifeSwing > 0) kanamotik.knifeSwing--;
        if (kanamotik.knifeCooldown > 0) kanamotik.knifeCooldown--;

        const homeX = KAN_TARGET_X();
        const dx = homeX - kanamotik.x;
        kanamotik.facing = dx > 0 ? 1 : -1;

        if (Math.abs(dx) > 20) {
          kanamotik.vx = Math.sign(dx) * MAX_VX * 1.3;
        } else {
          kanamotik.vx *= 0.8;
        }

        if (kanamotik.chargeTimer <= 0 || Math.abs(dx) < 25) {
          kanamotik.combatMode = 'ranged';
          kanamotik.chargeDecision = 60;
        }
      }
    }

    // === Победа ===
    if (kanamotik.hp <= 0 && !kanamotik.dead) {
      kanamotik.dead = true;
      duel.phase = 'ending';
      duel.winner = 'kagabotik';
      duel.endTimer = 140;
    } else if (k.hp <= 0) {
      duel.phase = 'ending';
      duel.winner = 'kanamotik';
      duel.endTimer = 140;
    }
    return;
  }

  if (duel.phase === 'ending') {
    duel.endTimer--;

    if (duel.winner === 'kagabotik' && kanamotik.dead) {
      kanamotik.deathAngle = Math.min(Math.PI / 2, kanamotik.deathAngle + 0.045);
      if (duel.endTimer < 70) kanamotik.alpha = Math.max(0, kanamotik.alpha - 0.022);
      k.mood = 'happy';
    } else if (duel.winner === 'kanamotik') {
      k.deathAngle = Math.min(Math.PI / 2, k.deathAngle + 0.045);
      if (duel.endTimer < 70) k.deathAlpha = Math.max(0, k.deathAlpha - 0.022);
    }

    if (duel.winner === 'kagabotik') k.mood = 'happy';
    k.bazooka.alpha += (0 - k.bazooka.alpha) * 0.08;

    if (duel.winner === 'kagabotik' && k.onGround && duel.endTimer % 30 === 0) {
      k.vy = JUMP_V * 0.55;
      k.onGround = false;
    }

    if (duel.endTimer <= 0) endDuel();
    return;
  }
}

/* =========================================================
   13. ОБЫЧНОЕ ПОВЕДЕНИЕ
   ========================================================= */
function updateNormal() {
  const now = performance.now();
  const bz = k.bazooka;

  const mouthX = k.x + MOUTH_OFFSET_X * k.facing;
  const mouthY = k.y - MOUTH_OFFSET_Y;

  if (k.eatCooldown <= 0) {
    const touch = mouthTouchesPaint(mouthX, mouthY, 14);
    if (touch) {
      const eaten = eatWholeBlob(touch.x, touch.y);
      if (eaten > 0) {
        k.eatAnim = 20;
        k.happyTimer = 80;
        k.eatCooldown = 6;
        k.committedFood = null;
        k.vx *= 0.3;
        spawnParticles(mouthX, mouthY, getPixelColor(touch.x, touch.y), 6, { speedMin: 1, speedMax: 3, gravity: -1.8, lifeMin: 24, lifeMax: 16, sizeMin: 2, sizeMax: 2.5 });
      }
    }
  }

  const mouthApex = k.groundY - JUMP_APEX - MOUTH_OFFSET_Y;
  const reachableMinY = mouthApex + REACH_MARGIN;
  const search = findFood(mouthX, mouthY, reachableMinY);

  let food = search.reachable || search.any;
  if (food) {
    if (k.committedFood && pixelHasPaint(k.committedFood.x, k.committedFood.y)) {
      const cf = k.committedFood;
      const sameArea = (cf.x - food.x) ** 2 + (cf.y - food.y) ** 2 < 60 * 60;
      const cfReachable = cf.y >= reachableMinY;
      if (sameArea || (cfReachable || !search.reachable)) food = cf;
      else k.committedFood = { x: food.x, y: food.y, attemptedJump: false };
    } else {
      k.committedFood = { x: food.x, y: food.y, attemptedJump: false };
    }
  } else {
    k.committedFood = null;
  }

  let targetVx = 0;
  let mood = 'idle';
  if (k.happyTimer > 0) mood = 'happy';

  if (food) {
    const dx = food.x - mouthX;
    const dy = food.y - mouthY;
    const reachable = food.y >= reachableMinY;

    if (reachable) {
      if (mood !== 'happy') mood = 'hungry';
      if (Math.abs(dx) > 8) targetVx = Math.sign(dx) * MAX_VX;
      // Усталость: проверяем, хватает ли стамины на прыжок
      if (dy < -20 && k.onGround && Math.abs(dx) < 100 && k.jumpCooldown <= 0 && k.stamina >= STAMINA_MIN_JUMP) {
        k.vy = JUMP_V; k.onGround = false; k.jumpCooldown = 50;
        k.stamina = Math.max(0, k.stamina - STAMINA_JUMP_COST);
      }
    } else {
      if (mood !== 'happy') mood = 'frustrated';
      if (Math.abs(dx) > 30) targetVx = Math.sign(dx) * MAX_VX * 0.55;
      else if (!food.attemptedJump && k.onGround && k.jumpCooldown <= 0 && k.stamina >= STAMINA_MIN_JUMP) {
        k.vy = JUMP_V * 0.92;
        k.onGround = false;
        k.jumpCooldown = 120;
        food.attemptedJump = true;
        k.stamina = Math.max(0, k.stamina - STAMINA_JUMP_COST);
      }
    }
  }

  const cursorVisible = (now - cursor.seenAt) < CURSOR_MEMORY_MS;
  const cursorDist = Math.hypot(cursor.x - k.x, cursor.y - (k.y - 30));

  if (bz.state === 'idle') {
    if (cursorVisible && cursorDist > MIN_SHOOT_DIST) {
      bz.state = 'aiming';
      bz.aiming = 0;
      const sx = k.x + k.facing * 10;
      const sy = k.y - 42;
      bz.aimAngle = Math.atan2(cursor.y - sy, cursor.x - sx);
    }
  }

  let aimingActive = false;
  if (bz.state === 'aiming') {
    aimingActive = true;
    mood = 'angry';
    targetVx = 0;
    k.facing = cursor.x > k.x ? 1 : -1;
    const sx = k.x + k.facing * 10;
    const sy = k.y - 42;
    const desired = Math.atan2(cursor.y - sy, cursor.x - sx);
    let diff = desired - bz.aimAngle;
    while (diff >  Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    bz.aimAngle += diff * 0.22;
    bz.aiming++;

    if (bz.aiming >= AIM_DURATION) {
      const recoilBack = bz.recoil * 2;
      const mx = sx + Math.cos(bz.aimAngle) * (34 - recoilBack);
      const my = sy + Math.sin(bz.aimAngle) * (34 - recoilBack);
      fireRocket(mx, my, bz.aimAngle, 'kagabotik');
      k.vx -= Math.cos(bz.aimAngle) * 3.5;
      bz.recoil = 6;
      bz.state = 'cooldown';
      bz.cooldown = SHOOT_COOLDOWN;
      bz.aiming = 0;
    }
  } else if (bz.state === 'cooldown') {
    bz.cooldown--;
    if (bz.cooldown <= 0) bz.state = 'idle';
  }

  const wantBazooka = aimingActive || bz.state === 'cooldown';
  bz.alpha += ((wantBazooka ? 1 : 0) - bz.alpha) * 0.18;

  k.mood = mood;

  if (targetVx !== 0) {
    k.vx += Math.sign(targetVx) * ACC;
    k.vx = Math.max(-MAX_VX, Math.min(MAX_VX, k.vx));
    if (Math.abs(targetVx) > 0.5 && !aimingActive) k.facing = targetVx > 0 ? 1 : -1;
  } else {
    k.vx *= FRICTION;
    if (Math.abs(k.vx) < 0.05) k.vx = 0;
  }
}

/* =========================================================
   14. ФИЗИКА + СТАМИНА
   ========================================================= */
function applyPhysics(c) {
  // Регенерация стамины
  const adrenaline = c.hp < MAX_HP * 0.3 ? STAMINA_REGEN_ADREN : 0;
  const regen = (c.onGround ? STAMINA_REGEN_GROUND : STAMINA_REGEN_AIR) + adrenaline;
  c.stamina = Math.min(STAMINA_MAX, c.stamina + regen);

  c.vy += GRAVITY;
  if (c.vy > 20) c.vy = 20;
  c.x += c.vx;
  c.y += c.vy;

  if (c.y >= c.groundY) {
    if (!c.onGround && c.vy > 6) c.squash = 0.82;
    c.y = c.groundY; c.vy = 0; c.onGround = true;
  }
  if (c.x < 26)     { c.x = 26;     c.vx = Math.abs(c.vx) * 0.3; }
  if (c.x > W - 26) { c.x = W - 26; c.vx = -Math.abs(c.vx) * 0.3; }

  if (c.vy < -3) c.squash = Math.max(1.08, c.squash || 1);
  c.squash = (c.squash || 1) + (1 - (c.squash || 1)) * 0.14;
}

/* =========================================================
   15. UPDATE
   ========================================================= */
function update() {
  k.blinkTimer--;
  if (k.blinkTimer <= 0) {
    if (k.blink) { k.blink = false; k.blinkTimer = 140 + Math.random() * 200; }
    else         { k.blink = true;  k.blinkTimer = 8; }
  }

  if (k.eatCooldown  > 0) k.eatCooldown--;
  if (k.jumpCooldown > 0) k.jumpCooldown--;
  if (k.eatAnim      > 0) k.eatAnim--;
  if (k.happyTimer   > 0) k.happyTimer--;
  if (k.bazooka.recoil > 0) k.bazooka.recoil--;
  if (k.hitFlash > 0) k.hitFlash--;
  if (kanamotik.hitFlash > 0) kanamotik.hitFlash--;
  if (k.dodgeCooldown > 0) k.dodgeCooldown--;
  if (kanamotik.dodgeCooldown > 0) kanamotik.dodgeCooldown--;
  if (k.dodgeFlash > 0) k.dodgeFlash--;
  if (kanamotik.dodgeFlash > 0) kanamotik.dodgeFlash--;

  if (duel.active) updateDuel();
  else             updateNormal();

  applyPhysics(k);
  if (kanamotik.active) applyPhysics(kanamotik);

  if (k.eatAnim > 0) {
    k.mouthOpen = 0.35 + 0.55 * Math.abs(Math.sin((20 - k.eatAnim) * 0.5));
  } else {
    k.mouthOpen *= 0.82;
  }

  updateRockets();
  updateBullets();
  updateExplosions();
}

/* =========================================================
   16. РЕНДЕР ПЕРСОНАЖЕЙ
   ========================================================= */
function drawKagabotik(ctx) {
  const { x, y, facing, mouthOpen, squash, blink, mood } = k;
  if (k.deathAlpha < 0.02) return;

  ctx.save();
  ctx.globalAlpha = k.deathAlpha;

  if (k.deathAngle > 0) {
    ctx.translate(x, y);
    ctx.rotate(-k.deathAngle);
    ctx.translate(-x, -y);
  }

  const airH = k.groundY - k.y;
  const shadowK = Math.max(0.35, 1 - airH / 340);
  ctx.save();
  ctx.globalAlpha = 0.2 * shadowK * k.deathAlpha;
  ctx.fillStyle = '#3a2416';
  ctx.beginPath();
  ctx.ellipse(x, k.groundY + 5, 28 * shadowK, 7 * shadowK, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  if (k.bazooka.alpha > 0.02) {
    const sx = x + facing * 10;
    const sy = y - 42;
    const angle = k.bazooka.aimAngle;
    const recoil = k.bazooka.recoil;
    ctx.save();
    ctx.globalAlpha = k.bazooka.alpha * k.deathAlpha;
    ctx.translate(sx, sy);
    ctx.rotate(angle);
    ctx.fillStyle = '#4a4a4a';
    ctx.fillRect(-4 - recoil * 0.8, -6, 38, 12);
    ctx.fillStyle = '#2b2b2b';
    ctx.fillRect(28 - recoil * 0.8, -8, 8, 16);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(32 - recoil * 0.8, -8, 3, 16);
    ctx.fillStyle = '#c9a227';
    ctx.fillRect(-2 - recoil * 0.8, -6, 4, 12);
    ctx.fillStyle = '#3a2416';
    ctx.beginPath(); ctx.arc(0, 4, 5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(facing, 1);
  ctx.scale(1 / squash, squash);

  ctx.fillStyle = '#F28B55';
  ctx.beginPath();
  ctx.moveTo(-18, -22);
  ctx.quadraticCurveTo(-40, -30, -35, -50);
  ctx.quadraticCurveTo(-30, -36, -16, -30);
  ctx.fill();

  ctx.fillStyle = '#E8784A';
  ctx.beginPath();
  ctx.ellipse(-13, -4, 9, 5.5, -0.15, 0, Math.PI * 2);
  ctx.ellipse( 13, -4, 9, 5.5,  0.15, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#F28B55';
  ctx.beginPath();
  ctx.moveTo(-16, -52); ctx.lineTo(-23, -78); ctx.lineTo(-3, -58); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo( 16, -52); ctx.lineTo( 23, -78); ctx.lineTo( 3, -58); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#FFC7A8';
  ctx.beginPath();
  ctx.moveTo(-15, -56); ctx.lineTo(-19, -72); ctx.lineTo(-7, -60); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo( 15, -56); ctx.lineTo( 19, -72); ctx.lineTo( 7, -60); ctx.closePath(); ctx.fill();

  const bodyGrad = ctx.createRadialGradient(-8, -48, 4, 0, -32, 36);
  bodyGrad.addColorStop(0, '#FFB98A');
  bodyGrad.addColorStop(1, '#F28B55');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(0, -30, 26, 30, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#FFE7D2';
  ctx.beginPath();
  ctx.ellipse(0, -20, 14, 16, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = mood === 'angry' ? 'rgba(230,60,60,0.7)' : 'rgba(255,120,120,0.5)';
  ctx.beginPath();
  ctx.arc(-16, -26, 5, 0, Math.PI * 2);
  ctx.arc( 16, -26, 5, 0, Math.PI * 2);
  ctx.fill();

  const eyeY = -40;
  if (blink && mood !== 'angry') {
    ctx.strokeStyle = '#3a2416'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-15, eyeY); ctx.quadraticCurveTo(-10, eyeY + 3, -5, eyeY);
    ctx.moveTo(  5, eyeY); ctx.quadraticCurveTo( 10, eyeY + 3, 15, eyeY);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(-10, eyeY, 8, 9, 0, 0, Math.PI * 2);
    ctx.ellipse( 10, eyeY, 8, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    let px = 1.5, py = 0;
    if (mood === 'hungry' || mood === 'happy') py = -1.2;
    if (mood === 'frustrated') py = -1.8;
    if (mood === 'angry') {
      const sx = k.x + k.facing * 10;
      const sy = k.y - 42;
      let ang;
      if (duel.active && kanamotik.active) ang = Math.atan2((kanamotik.y - 30) - sy, kanamotik.x - sx);
      else ang = Math.atan2(cursor.y - sy, cursor.x - sx);
      px = Math.cos(ang) * 2.5; py = Math.sin(ang) * 2.5;
    }
    ctx.fillStyle = mood === 'angry' ? '#3a0a0a' : '#2a1a10';
    ctx.beginPath();
    ctx.arc(-10 + px, eyeY + py, 4.6, 0, Math.PI * 2);
    ctx.arc( 10 + px, eyeY + py, 4.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-11 + px, eyeY - 2 + py, 1.7, 0, Math.PI * 2);
    ctx.arc(  9 + px, eyeY - 2 + py, 1.7, 0, Math.PI * 2);
    ctx.fill();
    if (mood === 'frustrated') {
      ctx.strokeStyle = '#3a2416'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-18, eyeY - 13); ctx.lineTo(-5, eyeY - 9);
      ctx.moveTo( 18, eyeY - 13); ctx.lineTo( 5, eyeY - 9);
      ctx.stroke();
    } else if (mood === 'angry') {
      ctx.strokeStyle = '#2a1010'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-20, eyeY - 16); ctx.lineTo(-4, eyeY - 6);
      ctx.moveTo( 20, eyeY - 16); ctx.lineTo( 4, eyeY - 6);
      ctx.stroke();
    }
  }

  const mouthY = -19;
  const openAmount = Math.max(mouthOpen, mood === 'frustrated' ? 0.3 : 0, mood === 'angry' ? 0.55 : 0);
  if (mood === 'angry' && openAmount > 0.2) {
    ctx.fillStyle = '#4a0a0a';
    ctx.beginPath();
    ctx.ellipse(2, mouthY + 1, 9, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff5566';
    ctx.beginPath();
    ctx.ellipse(2, mouthY + 3, 4, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(-4, mouthY - 5); ctx.lineTo(-1, mouthY + 1); ctx.lineTo(2, mouthY - 5);
    ctx.lineTo(5, mouthY + 1); ctx.lineTo(8, mouthY - 5); ctx.closePath();
    ctx.fill();
  } else if (openAmount > 0.08) {
    ctx.fillStyle = '#7a2a2a';
    ctx.beginPath();
    ctx.ellipse(2, mouthY, 8, 4 + openAmount * 6.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff7b8a';
    ctx.beginPath();
    ctx.ellipse(2, mouthY + 2 + openAmount * 2.5, 4, 2 + openAmount * 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-2, mouthY - 2 - openAmount * 4, 1.9, 0, Math.PI * 2);
    ctx.arc( 5, mouthY - 2 - openAmount * 4, 1.9, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.strokeStyle = '#3a2416'; ctx.lineWidth = 2.3; ctx.lineCap = 'round';
    ctx.beginPath();
    if (mood === 'happy') ctx.arc(2, mouthY - 3, 7, 0.15 * Math.PI, 0.85 * Math.PI);
    else { ctx.moveTo(-3, mouthY); ctx.quadraticCurveTo(2, mouthY + 3, 7, mouthY); }
    ctx.stroke();
  }

  ctx.restore();

  if (k.hitFlash > 0 && (k.hitFlash % 6 < 3)) {
    ctx.save();
    ctx.globalAlpha = 0.55 * k.deathAlpha;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = '#ff8080';
    ctx.beginPath(); ctx.arc(x, y - 32, 34, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  if (k.dodgeFlash > 0) {
    ctx.save();
    ctx.globalAlpha = (k.dodgeFlash / 10) * 0.8;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y - 30, 38 + (10 - k.dodgeFlash) * 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Sweat drop при низкой стамине
  if (k.stamina < 30 && k.deathAlpha > 0.5) {
    const t = performance.now() / 400;
    ctx.save();
    ctx.translate(x + 20 * facing, y - 70 + Math.sin(t) * 1.5);
    ctx.globalAlpha = (1 - k.stamina / 30) * 0.9 * k.deathAlpha;
    ctx.fillStyle = '#7dc4ff';
    ctx.beginPath();
    ctx.moveTo(0, -5);
    ctx.bezierCurveTo(4, 0, 3, 6, 0, 6);
    ctx.bezierCurveTo(-3, 6, -4, 0, 0, -5);
    ctx.fill();
    ctx.restore();
  }

  if (mood === 'frustrated' && !duel.active) {
    const t = performance.now() / 480;
    ctx.save();
    ctx.translate(x + 22 * facing, y - 62 + Math.sin(t) * 1.4);
    ctx.globalAlpha = 0.85 * k.deathAlpha;
    ctx.fillStyle = '#7dc4ff';
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.bezierCurveTo(5, 0, 4, 7, 0, 7);
    ctx.bezierCurveTo(-4, 7, -5, 0, 0, -6);
    ctx.fill();
    ctx.restore();
    const bounce = Math.abs(Math.sin(t * 0.9)) * 2.4;
    ctx.save();
    ctx.translate(x, y - 98 - bounce);
    ctx.fillStyle = '#8B5A3C';
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.75 * k.deathAlpha;
    ctx.fillText('…', 0, 0);
    ctx.restore();
  }

  if (mood === 'angry') {
    const t = performance.now() / 180;
    ctx.save();
    ctx.translate(x, y - 100 - Math.abs(Math.sin(t)) * 3);
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.9 * k.deathAlpha;
    ctx.fillStyle = '#c92a2a';
    ctx.fillText('💢', 0, 0);
    ctx.restore();
  }

  ctx.restore();
}

// --- Отрисовка ножа Канамотика ---
function drawKanamotikKnife(ctx, c) {
  const hasKnife = (c.combatMode === 'charging' || c.combatMode === 'retreating' || c.knifeSwing > 0);
  if (!hasKnife) return;

  const swingProgress = c.knifeSwing > 0
    ? 1 - c.knifeSwing / KNIFE_SWING_DUR
    : 0;

  let bladeAngle;
  if (c.knifeSwing > 0) {
    // Мах: от -π/2 (вверху) вниз-вперёд
    bladeAngle = -Math.PI / 2 + swingProgress * Math.PI * 1.2;
  } else {
    // Просто держит
    bladeAngle = -0.15;
  }

  const hx = c.x + c.facing * 22;
  const hy = c.y - 30;

  ctx.save();
  ctx.globalAlpha = c.alpha;
  ctx.translate(hx, hy);
  ctx.scale(c.facing, 1);
  ctx.rotate(bladeAngle);

  // рукоятка
  ctx.fillStyle = '#2a1a10';
  ctx.fillRect(-3, -2, 7, 4);
  // гарда
  ctx.fillStyle = '#8a6a3a';
  ctx.fillRect(3, -5, 3, 10);
  // клинок
  const bladeLen = 24;
  ctx.fillStyle = '#d0d0d8';
  ctx.beginPath();
  ctx.moveTo(6, -3);
  ctx.lineTo(6 + bladeLen, -1.5);
  ctx.lineTo(6 + bladeLen + 5, 0);
  ctx.lineTo(6 + bladeLen, 1.5);
  ctx.lineTo(6, 3);
  ctx.closePath();
  ctx.fill();
  // блик
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.moveTo(8, -1.2);
  ctx.lineTo(6 + bladeLen - 3, 0);
  ctx.lineTo(8, 1.2);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  // Слэш-эффект во время взмаха
  if (c.knifeSwing > 0 && swingProgress > 0.25 && swingProgress < 0.8) {
    const k1 = 1 - Math.abs(swingProgress - 0.5) * 2;
    ctx.save();
    ctx.globalAlpha = k1 * 0.8 * c.alpha;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(hx, hy, 46, -Math.PI * 0.75, Math.PI * 0.35);
    ctx.stroke();
    // второе, потоньше
    ctx.globalAlpha = k1 * 0.5 * c.alpha;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(hx, hy, 52, -Math.PI * 0.75, Math.PI * 0.35);
    ctx.stroke();
    ctx.restore();
  }
}

function drawKanamotik(ctx) {
  if (!kanamotik.active) return;
  const c = kanamotik;

  ctx.save();
  ctx.globalAlpha = c.alpha;

  if (c.deathAngle > 0) {
    ctx.translate(c.x, c.y);
    ctx.rotate(c.deathAngle);
    ctx.translate(-c.x, -c.y);
  }

  const shadowK = Math.max(0.35, 1 - (c.groundY - c.y) / 340);
  ctx.save();
  ctx.globalAlpha = 0.2 * shadowK * c.alpha;
  ctx.fillStyle = '#1a0a30';
  ctx.beginPath();
  ctx.ellipse(c.x, c.groundY + 5, 28 * shadowK, 7 * shadowK, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // --- Оружие под телом ---
  if (c.combatMode === 'ranged' || c.combatMode === 'retreating') {
    // Пистолет
    const sx = c.x + c.facing * 16;
    const sy = c.y - 42;
    const recoilBack = c.gunRecoil * 1.5;
    ctx.save();
    ctx.globalAlpha = c.alpha;
    ctx.translate(sx - recoilBack, sy);
    ctx.rotate(c.gunAngle);
    ctx.fillStyle = '#2b2b2b';
    ctx.fillRect(0, -4, 22, 8);
    ctx.fillStyle = '#111';
    ctx.fillRect(18, -3, 6, 6);
    ctx.restore();
  }
  // Нож рисуется отдельно после тела (чтобы был виден)

  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(c.facing, 1);
  const sq = c.squash || 1;
  ctx.scale(1 / sq, sq);

  ctx.fillStyle = '#5D4FB8';
  ctx.beginPath();
  ctx.moveTo(-18, -22);
  ctx.lineTo(-42, -18);
  ctx.lineTo(-16, -30);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#4A3E96';
  ctx.beginPath();
  ctx.ellipse(-13, -4, 9, 5.5, -0.15, 0, Math.PI * 2);
  ctx.ellipse( 13, -4, 9, 5.5,  0.15, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#5D4FB8';
  ctx.beginPath();
  ctx.moveTo(-16, -52); ctx.lineTo(-30, -84); ctx.lineTo(-2, -58); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo( 16, -52); ctx.lineTo( 30, -84); ctx.lineTo( 2, -58); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#B8A8FF';
  ctx.beginPath();
  ctx.moveTo(-15, -56); ctx.lineTo(-24, -76); ctx.lineTo(-6, -60); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo( 15, -56); ctx.lineTo( 24, -76); ctx.lineTo( 6, -60); ctx.closePath(); ctx.fill();

  const bodyGrad = ctx.createRadialGradient(-8, -48, 4, 0, -32, 36);
  bodyGrad.addColorStop(0, '#A89BFF');
  bodyGrad.addColorStop(1, '#6B5BD4');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(0, -30, 26, 30, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#E2DBFF';
  ctx.beginPath();
  ctx.ellipse(0, -20, 14, 16, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#3A2C8C';
  ctx.beginPath();
  ctx.moveTo(-4, -58);
  ctx.quadraticCurveTo(-8, -74, 6, -82);
  ctx.quadraticCurveTo(0, -70, 8, -60);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(200,100,220,0.55)';
  ctx.beginPath();
  ctx.arc(-16, -26, 5, 0, Math.PI * 2);
  ctx.arc( 16, -26, 5, 0, Math.PI * 2);
  ctx.fill();

  const eyeY = -40;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-10, eyeY, 8, 8, 0, 0, Math.PI * 2);
  ctx.ellipse( 10, eyeY, 8, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  let px = -2, py = 0;
  if (duel.active && k.hp > 0) {
    const ang = Math.atan2((k.y - 30) - (c.y - 42), k.x - (c.x + c.facing * 16));
    px = Math.cos(ang) * 2.5; py = Math.sin(ang) * 2.5;
  }
  ctx.fillStyle = '#1a0a2e';
  ctx.beginPath();
  ctx.arc(-10 + px, eyeY + py, 4.6, 0, Math.PI * 2);
  ctx.arc( 10 + px, eyeY + py, 4.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-11 + px, eyeY - 2 + py, 1.7, 0, Math.PI * 2);
  ctx.arc(  9 + px, eyeY - 2 + py, 1.7, 0, Math.PI * 2);
  ctx.fill();

  // Брови — злые (или яростные при charge)
  ctx.strokeStyle = c.combatMode === 'charging' ? '#5a1030' : '#1a0a2e';
  ctx.lineWidth = c.combatMode === 'charging' ? 3.6 : 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-20, eyeY - 17); ctx.lineTo(-4, eyeY - 6);
  ctx.moveTo( 20, eyeY - 17); ctx.lineTo( 4, eyeY - 6);
  ctx.stroke();

  const mouthY = -19;
  if (c.combatMode === 'charging') {
    // открытый рот, скалится
    ctx.fillStyle = '#2a0a2e';
    ctx.beginPath();
    ctx.ellipse(2, mouthY + 1, 8, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(-3, mouthY - 3); ctx.lineTo(-1, mouthY + 2); ctx.lineTo(1, mouthY - 3);
    ctx.lineTo(3, mouthY + 2); ctx.lineTo(5, mouthY - 3); ctx.lineTo(7, mouthY + 2);
    ctx.lineTo(9, mouthY - 3); ctx.closePath();
    ctx.fill();
  } else {
    ctx.strokeStyle = '#1a0a2e'; ctx.lineWidth = 2.3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-5, mouthY);
    ctx.quadraticCurveTo(2, mouthY + 4, 9, mouthY - 1);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(4, mouthY); ctx.lineTo(6, mouthY + 4); ctx.lineTo(8, mouthY - 1);
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();

  // Нож (поверх тела)
  drawKanamotikKnife(ctx, c);

  if (c.hitFlash > 0 && (c.hitFlash % 6 < 3)) {
    ctx.save();
    ctx.globalAlpha = 0.55 * c.alpha;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = '#ff8080';
    ctx.beginPath(); ctx.arc(c.x, c.y - 32, 34, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  if (c.dodgeFlash > 0) {
    ctx.save();
    ctx.globalAlpha = (c.dodgeFlash / 10) * 0.8;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(c.x, c.y - 30, 38 + (10 - c.dodgeFlash) * 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Sweat drop при низкой стамине
  if (c.stamina < 30 && c.alpha > 0.5 && c.hp > 0) {
    const t = performance.now() / 400;
    ctx.save();
    ctx.translate(c.x - 20 * c.facing, c.y - 70 + Math.sin(t) * 1.5);
    ctx.globalAlpha = (1 - c.stamina / 30) * 0.9 * c.alpha;
    ctx.fillStyle = '#7dc4ff';
    ctx.beginPath();
    ctx.moveTo(0, -5);
    ctx.bezierCurveTo(4, 0, 3, 6, 0, 6);
    ctx.bezierCurveTo(-3, 6, -4, 0, 0, -5);
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

/* =========================================================
   17. UI БАРЫ
   ========================================================= */
function drawHpBar(ctx, x, y, hp, maxHp, color) {
  const w = 80, h = 9;
  const bx = x - w / 2;
  const by = y;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(bx - 2, by - 2, w + 4, h + 4);
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(bx, by, w, h);
  const ratio = Math.max(0, hp / maxHp);
  ctx.fillStyle = color;
  ctx.fillRect(bx, by, w * ratio, h);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(bx, by, w * ratio, 3);
  ctx.strokeStyle = '#2b2b2b';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(bx, by, w, h);
  ctx.restore();
}

function drawStaminaBar(ctx, x, y, stamina, maxStamina) {
  const w = 80, h = 5;
  const bx = x - w / 2;
  const by = y;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(bx - 1, by - 1, w + 2, h + 2);
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(bx, by, w, h);
  const ratio = Math.max(0, stamina / maxStamina);
  let color = '#4ade80';
  if (ratio < 0.5) color = '#fbbf24';
  if (ratio < 0.25) color = '#ef4444';
  ctx.fillStyle = color;
  ctx.fillRect(bx, by, w * ratio, h);
  ctx.strokeStyle = '#2b2b2b';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, w, h);
  ctx.restore();
}

/* =========================================================
   18. LOOP
   ========================================================= */
function render() {
  gctx.clearRect(0, 0, W, H);

  const floorGrad = gctx.createLinearGradient(0, k.groundY - 14, 0, H);
  floorGrad.addColorStop(0, 'rgba(180,160,130,0)');
  floorGrad.addColorStop(1, 'rgba(160,140,110,0.25)');
  gctx.fillStyle = floorGrad;
  gctx.fillRect(0, k.groundY - 14, W, H - k.groundY + 14);

  drawKanamotik(gctx);
  drawKagabotik(gctx);

  drawRockets(gctx);
  drawBullets(gctx);
  drawExplosions(gctx);
  drawParticles(gctx);

  if (duel.active && kanamotik.active && duel.phase !== 'entering') {
    if (k.deathAlpha > 0.02) {
      drawHpBar(gctx, k.x, k.y - 128, k.hp, k.maxHp, '#e8a065');
      drawStaminaBar(gctx, k.x, k.y - 115, k.stamina, STAMINA_MAX);
    }
    if (kanamotik.alpha > 0.02) {
      drawHpBar(gctx, kanamotik.x, kanamotik.y - 128, kanamotik.hp, kanamotik.maxHp, '#9b7be8');
      drawStaminaBar(gctx, kanamotik.x, kanamotik.y - 115, kanamotik.stamina, STAMINA_MAX);
    }
  }

  if (duel.active && duel.phase === 'entering') {
    const t = performance.now() / 200;
    gctx.save();
    gctx.translate(W / 2, H / 2);
    gctx.scale(1 + Math.sin(t) * 0.05, 1 + Math.sin(t) * 0.05);
    gctx.font = 'bold 92px system-ui, sans-serif';
    gctx.textAlign = 'center';
    gctx.textBaseline = 'middle';
    gctx.fillStyle = 'rgba(0,0,0,0.6)';
    gctx.fillText('VS', 4, 6);
    gctx.fillStyle = '#c92a2a';
    gctx.fillText('VS', 0, 0);
    gctx.restore();
  }

  if (duel.active && duel.phase === 'ending' && duel.endTimer > 40) {
    const alpha = Math.min(1, (140 - duel.endTimer) / 20) * Math.min(1, duel.endTimer / 40);
    gctx.save();
    gctx.globalAlpha = alpha;
    gctx.font = 'bold 52px system-ui, sans-serif';
    gctx.textAlign = 'center';
    gctx.textBaseline = 'middle';
    gctx.fillStyle = '#2a2a2a';
    gctx.fillText('Победа!', W / 2 + 3, H * 0.32 + 3);
    gctx.fillStyle = duel.winner === 'kagabotik' ? '#e8a065' : '#9b7be8';
    gctx.fillText('Победа!', W / 2, H * 0.32);
    gctx.restore();
  }
}

function loop() {
  update();
  render();
  updateParticles();
  requestAnimationFrame(loop);
}

/* =========================================================
   19. СТАРТ
   ========================================================= */
function drawStarter() {
  const cols = ['#e63946','#f4a261','#2a9d8f'];
  cols.forEach((c, i) => {
    dctx.fillStyle = c;
    dctx.beginPath();
    dctx.arc(W * 0.66 + i * 46, H - 150, 20, 0, Math.PI * 2);
    dctx.fill();
  });
}

window.addEventListener('resize', resize);
resize();
drawStarter();
requestAnimationFrame(loop);

})();
</script>
